robot:
  urdf: ../cuarm_configuration/spark2_v2/share/no_gripper/arm_v2_stl.urdf
  base_link: base_link
  ee_links: [arm_end_effector]

grid:
  x_range: [-1.0, 1.0]
  y_range: [-1.0, 1.0]
  z_min: 0.10
  z_max: 0.80
  resolution: 0.05
  z_step: 0.05

orientations:
  count: 32

solver:
  ik_seeds: 8
  batch_size: 256
  position_tolerance: 0.005
  orientation_tolerance: 0.08
  self_collision: true
  sphere_density: 1.0
  collision_matrix_samples: 1000
  prune_collision_matrix: true

output:
  minimum_dexterity: 1.0
