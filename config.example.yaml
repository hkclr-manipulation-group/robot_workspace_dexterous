robot:
  # Reuse the project-local model from robot_workspace_projection.
  curobo_config: ../robot_workspace_projection/dual_arm.yaml
  base_link: dummy_world
  ee_links: [arm_end_effector_l, arm_end_effector_r]

grid:
  x_range: [-1.0, 1.0]
  y_range: [-1.0, 1.0]
  z_min: 0.10
  z_max: 0.80
  resolution: 0.05
  z_step: 0.05

orientations:
  # Deterministic approximately uniform samples over SO(3). Increase to 64 or
  # 128 for the final calculation after validating a coarse run.
  count: 32
  # Alternatively replace count with an explicit wxyz list:
  # samples_wxyz: [[1, 0, 0, 0], [0, 1, 0, 0]]

solver:
  ik_seeds: 8
  # Maximum number of (position, orientation) goals solved together on GPU.
  batch_size: 256
  position_tolerance: 0.005
  orientation_tolerance: 0.08
  self_collision: true

output:
  # Strict DWS: every sampled orientation must be reachable. Lower this value
  # only when the task defines a relaxed dexterous workspace.
  minimum_dexterity: 1.0
