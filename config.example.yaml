robot:
  # Spark2 V2 without a gripper. Relative paths resolve from this file.
  urdf: ../cuarm_configuration/spark2_v2/share/no_gripper/arm_v2_stl.urdf
  collision_spheres: ../collision_shpere_generation/examples/spark2_v2/collision_spheres.yaml
  # Optional generated mapping, merged with self_collision_ignore below.
  # self_collision_ignore_file: ../collision_shpere_generation/examples/robot/self_collision_ignore.yaml
  base_link: arm_base_link
  ee_links: [arm_end_effector]
  # Directly connected meshes overlap at their physical joint interfaces.
  self_collision_ignore:
    arm_base_link: [arm_L1]
    arm_L1: [arm_L2]
    arm_L2: [arm_L3]
    arm_L3: [arm_L4, arm_L5]
    arm_L4: [arm_L5]
    arm_L5: [arm_L6]

grid:
  x_range: [-1.0, 1.0]
  y_range: [-1.0, 1.0]
  # Include workspace below the base plane.
  z_min: -0.80
  z_max: 0.80
  resolution: 0.05
  z_step: 0.05

orientations:
  # Deterministic approximately uniform samples over SO(3). Increase to 64 or
  # 128 for the final calculation after validating a coarse run.
  count: 32

plot:
  # Defaults to grid x/y/z bounds when omitted.
  x_range: [-1.0, 1.0]
  y_range: [-1.0, 1.0]
  z_range: [-0.8, 0.8]
  # X for YZ, Y for XZ, and Z for XY center sections.
  sections_xyz: [0.0, 0.0, 0.0]
  base_position: [0.0, 0.0, 0.0]
  # Alternatively replace count with an explicit wxyz list:
  # samples_wxyz: [[1, 0, 0, 0], [0, 1, 0, 0]]

solver:
  ik_seeds: 8
  # Maximum number of (position, orientation) goals solved together on GPU.
  batch_size: 256
  position_tolerance: 0.005
  orientation_tolerance: 0.08
  # Collision spheres are loaded from robot.collision_spheres; no fitting runs here.
  self_collision: true

output:
  # Strict DWS: every sampled orientation must be reachable. Lower this value
  # only when the task defines a relaxed dexterous workspace.
  minimum_dexterity: 1.0
