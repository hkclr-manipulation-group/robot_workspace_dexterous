[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-workspace-dexterous"
version = "0.1.0"
description = "Compute collision-aware dexterous robot workspaces with cuRobo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
curobo = ["torch>=2.0"]
test = ["pytest>=7"]

[project.scripts]
robot-workspace-dexterous = "robot_workspace_dexterous.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
