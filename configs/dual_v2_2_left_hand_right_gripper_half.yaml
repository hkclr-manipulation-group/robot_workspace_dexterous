robot:
  urdf: ../models/dual_v2_2_left_hand_right_gripper_half/robot.urdf
  collision_spheres: ../models/dual_v2_2_left_hand_right_gripper_half/collision_spheres.yaml
  base_link: dummy_world
  ee_links:
  - arm_end_effector_l
  - arm_end_effector_r
  self_collision_ignore_file: ../models/dual_v2_2_left_hand_right_gripper_half/self_collision_ignore.yaml
grid:
  x_range:
  - -1.2
  - 1.2
  y_range:
  - -1.2
  - 1.2
  z_min: -0.6
  z_max: 1.4
  resolution: 0.05
  z_step: 0.05
orientations:
  count: 32
plot:
  x_range:
  - -1.2
  - 1.2
  y_range:
  - -1.2
  - 1.2
  z_range:
  - -0.6
  - 1.4
  sections_xyz:
  - 0.0
  - 0.0
  - 0.342
  base_position:
  - 0.0
  - 0.0
  - 0.0
solver:
  ik_seeds: 8
  batch_size: 4096
  position_tolerance: 0.005
  orientation_tolerance: 0.08
  self_collision: true
output:
  minimum_dexterity: 1.0
