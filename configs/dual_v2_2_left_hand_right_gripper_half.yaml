robot:
  urdf: ../../cuarm_configuration/dual_v2_2/share/left_hand_right_gripper_half/dual_arm_half.urdf
  collision_spheres: ../../collision_shpere_generation/examples/dual_v2_2/left_hand_right_gripper_half_collision_spheres.yaml
  base_link: dummy_world
  ee_links: [arm_end_effector_l, arm_end_effector_r]
  self_collision_ignore_file: ../../collision_shpere_generation/examples/dual_v2_2/left_hand_right_gripper_half_self_collision_ignore.yaml
  self_collision_ignore:
    SJ4Z: [arm_L1_l, arm_L1_r]
    arm_L1_l: [arm_L2_l]
    arm_L2_l: [arm_L3_l]
    arm_L3_l: [arm_L4_l]
    arm_L4_l: [arm_L5_l]
    arm_L5_l: [arm_L6_l]
    arm_L6_l: [arm_L7_l]
    arm_L7_l: [hand_base_link_l]
    arm_L1_r: [arm_L2_r]
    arm_L2_r: [arm_L3_r]
    arm_L3_r: [arm_L4_r]
    arm_L4_r: [arm_L5_r]
    arm_L5_r: [arm_L6_r]
    arm_L6_r: [arm_L7_r]
    arm_L7_r: [gripper_base_link_r]
    gripper_base_link_r: [gripper_L1_r, gripper_L2_r]
grid: {x_range: [-1.2, 1.2], y_range: [-1.2, 1.2], z_min: -0.6, z_max: 1.4, resolution: 0.05, z_step: 0.05}
orientations: {count: 32}
plot: {x_range: [-1.2, 1.2], y_range: [-1.2, 1.2], z_range: [-0.6, 1.4], sections_xyz: [0.0, 0.0, 0.342], base_position: [0.0, 0.0, 0.0]}
solver: {ik_seeds: 8, batch_size: 4096, position_tolerance: 0.005, orientation_tolerance: 0.08, self_collision: true}
output: {minimum_dexterity: 1.0}
