robot:
  urdf: ../models/spark2_v2/robot.urdf
  collision_spheres: ../models/spark2_v2/collision_spheres.yaml
  base_link: arm_base_link
  ee_links:
  - arm_end_effector
  self_collision_ignore_file: ../models/spark2_v2/self_collision_ignore.yaml
grid:
  x_range:
  - -1.0
  - 1.0
  y_range:
  - -1.0
  - 1.0
  z_min: -0.8
  z_max: 0.8
  resolution: 0.05
  z_step: 0.05
orientations:
  count: 32
solver:
  ik_seeds: 8
  batch_size: 4096
  position_tolerance: 0.005
  orientation_tolerance: 0.08
  self_collision: true
output:
  minimum_dexterity: 1.0
