robot:
  urdf: ../models/D20260901B/robot.urdf
  collision_spheres: ../models/D20260901B/collision_spheres.yaml
  self_collision_ignore_file: ../models/D20260901B/self_collision_ignore.yaml
  base_link: baselink
  ee_links:
  - Link06
grid:
  x_range:
  - -1.0
  - 1.0
  y_range:
  - -1.0
  - 1.0
  z_min: -1.0
  z_max: 1.0
  resolution: 0.1
  z_step: 0.1
orientations:
  count: 16
solver:
  ik_seeds: 4
  batch_size: 4096
  position_tolerance: 0.005
  orientation_tolerance: 0.08
  self_collision: true
output:
  minimum_dexterity: 1.0
