robot:
  urdf: ../../cuarm_configuration/dual_v2_1/share/with_gripper/dual_arm.urdf
  collision_spheres: ../../collision_shpere_generation/examples/dual_v2_1/with_gripper_collision_spheres.yaml
  base_link: dummy_world
  ee_links: [arm_end_effector_l, arm_end_effector_r]
  self_collision_ignore:
    DP: [s1]
    s1: [s2]
    s2: [s3]
    s3: [s4]
    s4: [arm_L1_l, arm_L1_r]
    arm_L1_l: [arm_L2_l]
    arm_L2_l: [arm_L3_l]
    arm_L3_l: [arm_L4_l]
    arm_L4_l: [arm_L5_l]
    arm_L5_l: [arm_L6_l]
    arm_L6_l: [arm_L7_l]
    arm_L7_l: [gripper_base_link_l]
    gripper_base_link_l: [gripper_L1_l, gripper_L2_l]
    arm_L1_r: [arm_L2_r]
    arm_L2_r: [arm_L3_r]
    arm_L3_r: [arm_L4_r]
    arm_L4_r: [arm_L5_r]
    arm_L5_r: [arm_L6_r]
    arm_L6_r: [arm_L7_r]
    arm_L7_r: [gripper_base_link_r]
    gripper_base_link_r: [gripper_L1_r, gripper_L2_r]
grid: {x_range: [-1.0, 1.0], y_range: [-1.0, 1.0], z_min: -0.8, z_max: 1.5, resolution: 0.05, z_step: 0.05}
orientations: {count: 32}
solver: {ik_seeds: 8, batch_size: 256, position_tolerance: 0.005, orientation_tolerance: 0.08, self_collision: true}
output: {minimum_dexterity: 1.0}
