robot:
  urdf: ../models/dual_v2_1_with_gripper/robot.urdf
  collision_spheres: ../models/dual_v2_1_with_gripper/collision_spheres.yaml
  base_link: dummy_world
  ee_links:
  - arm_end_effector_l
  - arm_end_effector_r
  self_collision_ignore_file: ../models/dual_v2_1_with_gripper/self_collision_ignore.yaml
grid:
  x_range:
  - -1.2
  - 1.2
  y_range:
  - -1.2
  - 1.2
  z_min: 0.2
  z_max: 2.3
  resolution: 0.05
  z_step: 0.05
orientations:
  count: 32
plot:
  x_range:
  - -1.2
  - 1.2
  y_range:
  - -1.2
  - 1.2
  z_range:
  - 0.2
  - 2.3
  sections_xyz:
  - 0.0
  - 0.0
  - 1.336
  base_position:
  - 0.0
  - 0.0
  - 0.0
solver:
  ik_seeds: 8
  batch_size: 4096
  position_tolerance: 0.005
  orientation_tolerance: 0.08
  self_collision: true
output:
  minimum_dexterity: 1.0
